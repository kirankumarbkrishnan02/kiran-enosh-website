<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login | Kiran Enosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <img src="images/logo.png" alt="Kiran Enosh Logo" class="auth-logo" />
    <h2>Welcome Back</h2>
    <p class="auth-sub">Login to access your admin dashboard</p>

    <div class="auth-message" id="messageBox"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required />

        <!-- FORCED-INLINE STYLE — cannot be overridden by any CSS -->
        <div style="display:flex !important; flex-direction:row !important; align-items:center !important; gap:10px !important; margin-top:12px; white-space:nowrap;">
          <input
            type="checkbox"
            id="showPassword"
            onclick="togglePwd('password', this)"
            style="width:18px !important; height:18px !important; min-width:18px !important; max-width:18px !important; flex:0 0 18px !important; margin:0 !important; cursor:pointer; accent-color:#ff7b00;"
          />
          <label for="showPassword" style="display:inline-block !important; margin:0 !important; padding:0 !important; font-size:14px; color:#c3cce0; cursor:pointer; font-weight:400;">
            Show Password
          </label>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn" style="background: linear-gradient(135deg, #0a4da6, #ff5500);">Access Admin Panel</button>
    </form>

    <p class="auth-switch" style="margin-top: 20px;">
      <a href="index.html" style="color: #7a89a8;">← Back to Homepage</a>
    </p>
  </div>
  

      <p style="text-align:right;margin-top:-6px;margin-bottom:14px;">
        <a href="forgot-password.html" style="color:#ff7b00;font-size:13px;font-weight:600;text-decoration:none;">
          Forgot Password?
        </a>
      </p>

      <button type="submit" class="btn-submit" id="submitBtn">Login</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="register.html">Register now</a>
    </p>
    <p class="auth-switch">
      <a href="index.html">← Back to Home</a>
    </p>
  </div>
</div>

<script>
  const API_BASE = '/api/auth';

  function showMessage(text, type) {
    const box = document.getElementById('messageBox');
    box.textContent = text;
    box.className = 'auth-message ' + (type || 'error');
  }

  function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁️';
    }
  }

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');

    if (!email || !password) {
      return showMessage('Please enter email and password.');
    }

    btn.disabled = true;
    btn.textContent = 'Verifying...';

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'Access Admin Panel';
        return showMessage(data.error || 'Invalid credentials.');
      }

      // Check if the logged-in user is actually an admin
      if (data.user.role !== 'admin') {
        // Log them out immediately for security
        await fetch(`${API_BASE}/logout`, { method: 'POST', credentials: 'include' });
        btn.disabled = false;
        btn.textContent = 'Access Admin Panel';
        return showMessage('❌ Access Denied. This account is not an administrator.');
      }

      showMessage('✅ Admin access granted. Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 800);

    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Access Admin Panel';
      showMessage('Cannot reach server.');
    }
  });
</script>

</body>
</html>
