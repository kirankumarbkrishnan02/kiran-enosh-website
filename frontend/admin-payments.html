<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Records | Kiran Enosh Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
  .table-wrapper { background: rgba(20,42,82,0.7); border-radius: 15px; overflow: auto; border: 1px solid rgba(74,144,226,0.3); margin-top: 25px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  .admin-table th { padding: 15px; text-align: left; color: #ff7b00; font-size: 12px; text-transform: uppercase; background: rgba(255,123,0,0.05); border-bottom: 1px solid rgba(255,123,0,0.2); position: sticky; top: 0; }
  .admin-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c3cce0; }
  .admin-table tr:hover { background: rgba(255,123,0,0.03); }
  
  .badge-deposit { background: rgba(255,193,7,0.2); color: #ffc107; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-full { background: rgba(34,197,94,0.2); color: #22c55e; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: linear-gradient(160deg, #142a52, #0a1128); padding: 25px; border-radius: 15px; border: 1px solid rgba(74,144,226,0.3); }
  .stat-card h4 { color: #7a89a8; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; }
  .stat-card .value { color: #fff; font-size: 28px; font-weight: 800; }
</style>
</head>
<body>
  
<nav class="navbar">
  <a href="admin-dashboard.html" class="nav-brand">
    <img src="images/" alt="Kiran Enosh Logo" />
    <div class="nav-brand-text">KIRAN ENOSH<span>ADMIN PANEL</span></div>
  </a>
  <a href="admin-dashboard.html" class="nav-cta" style="background:rgba(74,144,226,0.2);border:1px solid rgba(74,144,226,0.5);">← Admin Home</a>
</nav>

<div class="dashboard-page">
  <div class="admin-container">
    <h2 class="section-title" style="text-align:left;font-size:28px;margin-bottom:20px;">Payment & Enrollment Records</h2>
    
    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4>Total Payments</h4>
        <div class="value" id="totalPayments">—</div>
      </div>
      <div class="stat-card">
        <h4>Total Revenue</h4>
        <div class="value" id="totalRevenue" style="color:#ffb347;">—</div>
      </div>
      <div class="stat-card">
        <h4>Active Students</h4>
        <div class="value" id="activeStudents">—</div>
      </div>
    </div>

    <!-- Payments Table -->
    <div class="table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Receipt #</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Amount</th>
            <th>Plan</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="paymentsTable">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:#7a89a8;">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = '/api';

  async function loadPayments() {
    const tbody = document.getElementById('paymentsTable');
    try {
      const res = await fetch(`${API}/admin/payments`, { credentials: 'include' });
      
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          window.location.href = 'login.html';
          return;
        }
        throw new Error('Server error ' + res.status);
      }

      const data = await res.json();
      const payments = data.payments || [];

      // 1. Calculate Stats
      let totalRev = 0;
      const uniqueStudents = new Set();

      payments.forEach(p => {
        totalRev += p.amount || 0;
        uniqueStudents.add(p.user_id);
      });

      document.getElementById('totalPayments').textContent = payments.length;
      document.getElementById('totalRevenue').textContent = '₹' + totalRev.toLocaleString('en-IN');
      document.getElementById('activeStudents').textContent = uniqueStudents.size;

      // 2. Render Table
      if (!payments.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#7a89a8;">No payments recorded yet.</td></tr>';
        return;
      }

      let html = '';
      payments.forEach(p => {
        let badgeClass = p.payment_type === 'deposit' ? 'badge-deposit' : 'badge-full';
        let planText = p.payment_type === 'deposit' ? '₹' + p.amount + ' Deposit' : 'Full Payment';
        
        // Format Date
        let dateObj = new Date(p.paid_at);
        let dateStr = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

        html += `
          <tr>
            <td style="font-family: monospace; color:#7fb3ff;">${p.receipt_number}</td>
            <td><strong>${p.user_name || 'Unknown'}</strong></td>
            <td>${p.user_email || '—'}</td>
            <td>${p.course_name}</td>
            <td style="color:#ffb347; font-weight:700;">₹${(p.amount || 0).toLocaleString('en-IN')}</td>
            <td><span class="${badgeClass}">${planText}</span></td>
            <td style="color:#22c55e; font-weight:600;">✓ ${p.status}</td>
            <td>${dateStr}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

    } catch (err) {
      console.error('Error loading payments:', err);
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#ff8a8a;padding:30px;">Error: ${err.message}</td></tr>`;
    }
  }

  // Load data when page opens
  loadPayments();
</script>

</body>

</html>
