<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attendance & Live Class | Kiran Enosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .attendance-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .course-selector {
    background: rgba(20,42,82,0.9); padding: 25px; border-radius: 15px; margin-bottom: 30px;
    border: 1px solid rgba(74,144,226,0.3);
  }
  .course-selector select {
    width: 100%; padding: 15px; margin-top: 10px; border-radius: 10px;
    background: rgba(0,0,0,0.5); color: white; border: 1px solid #4a90e2; font-size: 16px;
  }
  .session-card {
    background: linear-gradient(160deg, #142a52, #0a1128);
    padding: 40px; border-radius: 20px; text-align: center;
    border: 1px solid rgba(255,123,0,0.3); margin-bottom: 30px;
  }
  .status-badge {
    display: inline-block; padding: 8px 20px; border-radius: 20px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;
  }
  .status-pending { background: rgba(255,193,7,0.2); color: #ffc107; border: 1px solid #ffc107; }
  .status-approved { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid #22c55e; }
  .status-rejected { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid #ef4444; }
  .status-none { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid #94a3b8; }
  .btn-meet { display: inline-block; padding: 15px 35px; background: #22c55e; color: white; text-decoration: none; border-radius: 30px; font-weight: 700; margin-top: 20px; transition: 0.3s; }
  .btn-meet:hover { background: #16a34a; transform: translateY(-3px); }
  .btn-mark { display: inline-block; padding: 15px 35px; background: linear-gradient(135deg,#ff7b00,#ff5500); color: white; border: none; border-radius: 30px; font-weight: 700; margin-top: 20px; cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 16px; }
  .btn-mark:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255,123,0,0.4); }
  .btn-mark:disabled { opacity: 0.5; cursor: not-allowed; }
  .no-session { color: #7a89a8; font-style: italic; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="dashboard.html" class="nav-brand">
    <img src="images/logo.png" alt="Kiran Enosh Logo" />
    <div class="nav-brand-text">KIRAN ENOSH<span>STUDENT PORTAL</span></div>
  </a>
  <a href="dashboard.html" class="nav-cta" style="background:rgba(74,144,226,0.2);border:1px solid rgba(74,144,226,0.5);">← Dashboard</a>
</nav>

<div class="dashboard-page">
  <div class="attendance-container">
    <h2 class="section-title" style="text-align:center;margin-bottom:10px;">Daily Attendance & Live Class</h2>
    <p style="text-align:center;color:#a5b1cc;margin-bottom:30px;">Select your course to view today's class and mark your attendance.</p>

    <div class="course-selector">
      <label style="color:#c3cce0;font-weight:600;">Select Course</label>
      <select id="courseSelect" onchange="loadSession()">
        <option value="">-- Choose a course --</option>
      </select>
    </div>

    <div id="sessionArea" style="display:none;">
      <div class="session-card">
        <h3 style="color:#fff;margin-bottom:20px;" id="selectedCourseName"></h3>
        
        <div id="attendanceStatusArea">
          <!-- Status will be injected here -->
        </div>

        <div id="meetLinkArea" style="margin-top:30px;">
          <!-- Meet link will be injected here -->
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:5000/api';
  const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD

  let enrolledCourses = [];

    // 1. Load enrolled courses
  fetch(`${API}/admin/my-courses`, { credentials: 'include' })
    .then(r => {
      if (!r.ok) throw new Error('Not logged in or server error');
      return r.json();
    })
    .then(data => {
      const select = document.getElementById('courseSelect');
      // Clear the default option first to avoid duplicates if loaded twice
      select.innerHTML = '<option value="">-- Choose a course --</option>';
      
      if (data.courses && data.courses.length > 0) {
        data.courses.forEach(course => {
          const opt = document.createElement('option');
          // Check if the API returns an object or a string
          const courseName = typeof course === 'string' ? course : (course.course_name || course.title);
          opt.value = courseName;
          opt.textContent = courseName;
          select.appendChild(opt);
        });
      } else {
        // If the student has no enrollments
        const opt = document.createElement('option');
        opt.value = "";
        opt.textContent = "You are not enrolled in any courses yet.";
        select.appendChild(opt);
      }
    })
    .catch(err => {
      console.error('Error loading courses:', err);
      const select = document.getElementById('courseSelect');
      select.innerHTML = '<option value="">Error loading courses. Please refresh.</option>';
    });
    
  // 2. Load session for selected course
  async function loadSession() {
    const course = document.getElementById('courseSelect').value;
    const area = document.getElementById('sessionArea');
    
    if (!course) {
      area.style.display = 'none';
      return;
    }

    area.style.display = 'block';
    document.getElementById('selectedCourseName').textContent = course;
    document.getElementById('attendanceStatusArea').innerHTML = '<p style="color:#7a89a8;">Loading...</p>';
    document.getElementById('meetLinkArea').innerHTML = '';

    try {
      const res = await fetch(`${API}/attendance/student/session/${encodeURIComponent(course)}?date=${today}`, { credentials: 'include' });
      const data = await res.json();

      // Render Meet Link
      const meetArea = document.getElementById('meetLinkArea');
      if (data.meet_link) {
        meetArea.innerHTML = `
          <p style="color:#c3cce0;margin-bottom:10px;">Today's Live Class Link:</p>
          <a href="${data.meet_link}" target="_blank" class="btn-meet">🎥 Join Google Meet</a>
        `;
      } else {
        meetArea.innerHTML = `<p class="no-session">No live session link has been provided by the admin yet.</p>`;
      }

      // Render Attendance Status
      const statusArea = document.getElementById('attendanceStatusArea');
      if (data.attendance_status === 'pending') {
        statusArea.innerHTML = `<span class="status-badge status-pending">⏳ Pending Approval</span><p style="color:#a5b1cc;font-size:14px;">Wait until the class ends. Admin will verify your attendance.</p>`;
      } else if (data.attendance_status === 'approved') {
        statusArea.innerHTML = `<span class="status-badge status-approved">✅ Attendance Approved</span><p style="color:#a5b1cc;font-size:14px;">Your attendance has been verified.</p>`;
      } else if (data.attendance_status === 'rejected') {
        statusArea.innerHTML = `<span class="status-badge status-rejected">❌ Attendance Rejected</span><p style="color:#a5b1cc;font-size:14px;">Admin could not verify your presence in the live class.</p>`;
      } else {
        statusArea.innerHTML = `
          <span class="status-badge status-none">Not Marked</span>
          <p style="color:#a5b1cc;font-size:14px;margin-bottom:15px;">You haven't marked your attendance for today.</p>
          <button class="btn-mark" onclick="markAttendance('${course}')">Mark Attendance</button>
        `;
      }
    } catch (err) {
      console.error(err);
      document.getElementById('attendanceStatusArea').innerHTML = '<p style="color:#ff8a8a;">Error loading session.</p>';
    }
  }

  // 3. Mark Attendance
  async function markAttendance(course) {
    try {
      const res = await fetch(`${API}/attendance/student/attendance`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ course_name: course, session_date: today })
      });
      const data = await res.json();

      if (!res.ok) {
        alert('❌ ' + (data.error || 'Failed to mark attendance'));
        return;
      }

      alert('✅ Attendance submitted! Waiting for admin approval.');
      loadSession(); // Refresh the UI
    } catch (err) {
      console.error(err);
      alert('Cannot reach server.');
    }
  }
</script>

</body>
</html>
