<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Courses | Kiran Enosh</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />

</head>
<body style="background-color: #0a1128; margin: 0; padding: 0;">

  <!-- Updated Navbar with Home Button and User Name -->
<div style="background-color: #0b132b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 10px;">
  <a href="dashboard.html" style="display: flex; align-items: center; text-decoration: none;">
    
    <div style="color: white; font-family: 'Poppins', sans-serif;">
      <span style="font-weight: 800; font-size: 18px; display: block;">KIRAN ENOSH</span>
      <span style="color: #ff7b00; font-size: 12px; font-weight: 600; letter-spacing: 1px;">STUDENT PORTAL</span>
    </div>
  </a>
  
  <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <span id="userPill" style="display:none; color: #7fb3ff; font-size: 13px; font-weight: 600; background: rgba(74,144,226,0.15); padding: 8px 15px; border-radius: 20px;">
      <span style="color: #22c55e;">●</span> <span id="userNameNav">Student</span>
    </span>
    <a href="index.html" style="color: white; text-decoration: none; border: 1px solid #4a90e2; padding: 10px 20px; border-radius: 20px; font-family: sans-serif; font-weight: bold;"> Home</a>
    <a href="dashboard.html" style="color: white; text-decoration: none; border: 1px solid #4a90e2; padding: 10px 20px; border-radius: 20px; font-family: sans-serif; font-weight: bold;">← Dashboard</a>
  </div>
</div>

<!-- Main Content -->
<div style="max-width: 1200px; margin: 40px auto; padding: 0 20px; font-family: 'Poppins', sans-serif;">
  
  <div style="text-align: center; margin-bottom: 50px;">
    <h1 style="color: white; font-size: 36px; margin-bottom: 10px;">Explore Our <span style="color: #ff7b00;">Courses</span></h1>
    <p style="color: #a5b1cc; font-size: 16px;">Choose the program that fits your career goals.</p>
  </div>

  

<!-- SCRIPT TO HIDE PRICES AND REDIRECT GUESTS -->
<script>
  const API_AUTH = '/api/auth';

  // Check if user is logged in
  fetch(`${API_AUTH}/me`, { credentials: 'include' })
    .then(res => {
      if (!res.ok) throw new Error('Not logged in');
      return res.json();
    })
    .then(data => {
      // User IS logged in
      const user = data.user;
      
      // 1. Show user name in navbar
      const pill = document.getElementById('userPill');
      const nameEl = document.getElementById('userNameNav');
      if (pill && nameEl) {
        nameEl.textContent = user.name;
        pill.style.display = 'inline-block';
      }
      
      // 2. Prices remain visible (do nothing)
    })
    .catch(err => {
      // User is NOT logged in
      console.log('Guest mode active');

      // 1. Hide all prices and show "Login to see fees"
      const priceElements = document.querySelectorAll('.course-price-display');
      priceElements.forEach(el => {
        el.textContent = 'Login to see fees';
        el.style.color = '#ff7b00';
        el.style.fontSize = '16px';
      });

      // 2. Redirect guests to login if they click Enroll
      const enrollButtons = document.querySelectorAll('.enroll-btn');
      enrollButtons.forEach(btn => {
        btn.href = 'login.html';
        btn.textContent = 'Login to Enroll →';
      });
    });
</script>

</body>
</html>
