<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password | Kiran Enosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  
<div class="auth-page">
  <div class="auth-card">
    <h2>Forgot Password?</h2>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

    <!-- This is where the success/error message will appear -->
    <div class="auth-message" id="messageBox"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link</button>
    </form>

    <p class="auth-switch">
      Remember your password? <a href="login.html">Back to Login</a>
    </p>
  </div>
</div>

<!-- ============================================== -->
<!-- LINK TO THE EXTERNAL AUTH.JS FILE HERE -->
<!-- This handles the fetch request to the backend -->
<!-- ============================================== -->
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>

</body>

</html>
