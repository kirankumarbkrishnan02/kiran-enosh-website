<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4da6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7b00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0a1128" stroke="url(#grad)" stroke-width="6"/>
  
  <!-- Combined KEC Shape -->
  <g fill="url(#grad)">
    <!-- The K (vertical bar + diagonal arms) -->
    <rect x="35" y="50" width="15" height="100" rx="4"/>
    <polygon points="50,95 80,50 100,50 65,105 100,150 80,150"/>
    
    <!-- The E (horizontal bars) -->
    <rect x="105" y="50" width="60" height="14" rx="4"/>
    <rect x="105" y="95" width="45" height="12" rx="4"/>
    <rect x="105" y="136" width="60" height="14" rx="4"/>
    
    <!-- The C (curved bracket) -->
    <path d="M 175 55 Q 160 45 140 45 Q 105 45 105 100 Q 105 155 140 155 Q 160 155 175 145" 
          fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>