<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register | Kiran Enosh Group of Institutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>
<!-- Dark/Light Mode Toggle -->
<button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
<div class="auth-page">
  <div class="auth-card">
    <img src="images/logo.png" alt="Kiran Enosh Logo" class="auth-logo" />
    <h2>Create Your Account</h2>
    <p class="auth-sub">Join the Kiran Enosh community today</p>

    <div class="auth-message" id="messageBox"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 symbol" required />

        <div style="display:flex !important; flex-direction:row !important; align-items:center !important; gap:10px !important; margin-top:12px; white-space:nowrap;">
          <input
            type="checkbox"
            id="showPassword"
            onclick="togglePwd('password', this)"
            style="width:18px !important; height:18px !important; min-width:18px !important; max-width:18px !important; flex:0 0 18px !important; margin:0 !important; cursor:pointer; accent-color:#ff7b00;"
          />
          <label for="showPassword" style="display:inline-block !important; margin:0 !important; padding:0 !important; font-size:14px; color:#c3cce0; cursor:pointer; font-weight:400;">
            Show Password
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    <p class="auth-switch">
      <a href="index.html">← Back to Home</a>
    </p>
  </div>
</div>

<script src="js/auth.js"></script>

<script>
  function togglePwd(inputId, checkbox) {
    var input = document.getElementById(inputId);
    input.type = checkbox.checked ? 'text' : 'password';
  }
</script>

</body>
<script src="js/theme.js"></script>
</html>
