<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password | Kiran Enosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <img src="images/" alt="Kiran Enosh Logo" class="auth-logo" />
    <h2>Set New Password</h2>
    <p class="auth-sub">Choose a strong password to secure your account.</p>

    <div class="auth-message" id="messageBox"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 symbol" required />

        <div style="display:flex !important; flex-direction:row !important; align-items:center !important; gap:10px !important; margin-top:12px; white-space:nowrap;">
          <input
            type="checkbox"
            id="showPassword1"
            onclick="togglePwd('password', this)"
            style="width:18px !important; height:18px !important; min-width:18px !important; max-width:18px !important; flex:0 0 18px !important; margin:0 !important; cursor:pointer; accent-color:#ff7b00;"
          />
          <label for="showPassword1" style="display:inline-block !important; margin:0 !important; padding:0 !important; font-size:14px; color:#c3cce0; cursor:pointer; font-weight:400;">
            Show Password
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm New Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter the same password" required />

        <div style="display:flex !important; flex-direction:row !important; align-items:center !important; gap:10px !important; margin-top:12px; white-space:nowrap;">
          <input
            type="checkbox"
            id="showPassword2"
            onclick="togglePwd('confirm', this)"
            style="width:18px !important; height:18px !important; min-width:18px !important; max-width:18px !important; flex:0 0 18px !important; margin:0 !important; cursor:pointer; accent-color:#ff7b00;"
          />
          <label for="showPassword2" style="display:inline-block !important; margin:0 !important; padding:0 !important; font-size:14px; color:#c3cce0; cursor:pointer; font-weight:400;">
            Show Password
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Reset Password</button>
    </form>

    <p class="auth-switch">
      <a href="login.html">← Back to Login</a>
    </p>
  </div>
</div>

<script>
  var API = '/api/auth';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var box = document.getElementById('messageBox');

  if (!token) {
    box.textContent = '❌ Missing reset token. Please use the link from your email.';
    box.className = 'auth-message error';
    document.getElementById('resetForm').style.display = 'none';
  }

  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    var btn = document.getElementById('submitBtn');

    if (password.length < 8) { box.textContent = 'Password must be at least 8 characters.'; box.className = 'auth-message error'; return; }
    if (!/[A-Z]/.test(password)) { box.textContent = 'Password must include an uppercase letter.'; box.className = 'auth-message error'; return; }
    if (!/[a-z]/.test(password)) { box.textContent = 'Password must include a lowercase letter.'; box.className = 'auth-message error'; return; }
    if (!/[0-9]/.test(password)) { box.textContent = 'Password must include a number.'; box.className = 'auth-message error'; return; }
    if (!/[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/~`';]/.test(password)) { box.textContent = 'Password must include a symbol.'; box.className = 'auth-message error'; return; }
    if (password !== confirm) { box.textContent = 'Passwords do not match.'; box.className = 'auth-message error'; return; }

    btn.disabled = true;
    btn.textContent = 'Resetting...';
    box.className = 'auth-message';

    try {
      var res = await fetch(API + '/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // Added this for cross-origin cookies
        body: JSON.stringify({ token: token, password: password }),
      });
      var data = await res.json();

      if (!res.ok) {
        var msg = data.error || (data.errors && data.errors[0] && data.errors[0].msg) || 'Reset failed.';
        box.textContent = '❌ ' + msg;
        box.className = 'auth-message error';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
        return;
      }

      box.innerHTML = '✅ Password reset successfully!<br>Redirecting to login...';
      box.className = 'auth-message success';
      setTimeout(function () { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      console.error(err);
      box.textContent = '❌ Cannot reach server. Please try again.';
      box.className = 'auth-message error';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });

  function togglePwd(inputId, checkbox) {
    var input = document.getElementById(inputId);
    input.type = checkbox.checked ? 'text' : 'password';
  }
</script>

</body>

</html>
